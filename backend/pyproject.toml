[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildingos-backend"
version = "0.1.0"
description = "Backend API for BuildingOS"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
]

[tool.setuptools.packages.find]
where = ["."]